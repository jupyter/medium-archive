# One environment with the tool, the external programs the site
# exporters call, the three site generators and the test suite:
#
#   pixi install                    # create .pixi/envs/default
#   pixi run medium-archive --help  # run anything in it
#   pixi run test
#   pixi run build-pelican          # or build-hugo, build-myst
#
# Everything, locally and in CI, runs through `pixi run`. The tool's
# commands are run as `pixi run medium-archive <command>`; tasks exist
# only for what is more than one command.

[workspace]
name = "medium-archive"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = ">=3.11"
# Animated gifs are placed as H.264 clips with a webp poster; a build
# that cannot make one stops. conda-forge's lgpl ffmpeg builds lack
# libx264, so the gpl build is asked for by name.
ffmpeg = { version = "*", build = "gpl*" }
# Hugo extended, which conda-forge's build is. Hugo and mystmd are
# pinned to the versions the archive's sites were last validated
# against (see todo.md); CI's preview build uses these too.
hugo = "0.158.*"
mystmd = "1.10.*"
# what the generated pelicanconf.py reads posts and data files with
pelican = ">=4.12"
markdown-it-py = "*"
mdit-py-plugins = "*"
pygments = "*"
pyyaml = "*"
pillow = "*"
# caps the frame rate of a gif the pelican site stores as a gif
numpy = "*"
# resizes gifs kept as gifs (site.toml animated_format = "gif")
gifsicle = "*"
# the tests: pytest, and jinja2 to render the pelican theme's pages
pytest = "*"
jinja2 = "*"

[pypi-dependencies]
medium-archive = { path = ".", editable = true }
# search index for the Hugo and Pelican sites; not on conda-forge. The
# package installs no `pagefind` executable: run it as `pixi run
# pagefind` (the task below) or `python -m pagefind`.
pagefind = { version = "==1.5.2", extras = ["bin"] }

# fetch --solve-walls: a real browser for a human to clear a bot
# wall's challenge. A separate environment, since only fetch needs it:
#   pixi run -e solve-walls playwright install chromium
#   pixi run -e solve-walls medium-archive fetch URL --solve-walls
[feature.solve-walls.dependencies]
playwright-python = "*"

[environments]
solve-walls = ["solve-walls"]

[tasks]
# A build task runs the exporter (`medium-archive hugo`, which only
# writes the site's sources into site-hugo/), then the generator, then
# Pagefind; CI's preview build runs these same tasks. They are not
# named after their generators, which would shadow the executables:
# `pixi run hugo server` must reach Hugo.
test = "pytest -q"
pagefind = "python -m pagefind"
build-hugo = { cmd = "medium-archive hugo && cd site-hugo && hugo && python -m pagefind --site public", description = "Export and build the Hugo site into site-hugo/public/" }
# The Pelican site stores each animation as an AV1 master and its build
# makes the h264 it serves from it; that h264 is cached beside the
# exporter's copies in .image-cache/, which CI restores.
build-pelican = { cmd = "medium-archive pelican && cd site-pelican && pelican && python -m pagefind --site output", env = { CLIP_CACHE = "$PIXI_PROJECT_ROOT/.image-cache/clips" }, description = "Export and build the Pelican site into site-pelican/output/" }
build-myst = { cmd = "medium-archive myst && cd site-myst && myst build --html", description = "Export and build the MyST site into site-myst/_build/html/" }
