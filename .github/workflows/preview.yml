# Build previews of the archive's three generated sites and publish them
# to GitHub Pages under /hugo/, /pelican/ and /myst/, with a landing
# page linking the three -- so the generators can be compared on
# identical content before one is chosen.
#
# Everything is regenerated from archive/raw/ + archive/fixups/ on each
# run: `convert` rebuilds archive/posts/, each site exporter rebuilds
# its top-level site directory with base_url pointed at this
# deployment's subpath (site/site.toml is patched only in the runner's
# workspace), and each generator builds its site. Nothing derived is
# committed.
#
# Note on size: the exporters place capped display copies of the
# images (originals stay in archive/raw/ and archive/posts/), and an
# animated gif is placed as an h264 clip with a poster, which is where
# most of the weight went: the archive's 805 MB of images become 237 MB
# placed, of which the 228 animations are 157 MB against 609 MB as
# gifs. Each built site is a few hundred MB and the three previews
# together well under GitHub Pages' documented 1 GB site limit.
#
# One-time setup: the configure-pages step below enables Pages for the
# repository (source: GitHub Actions) if it is not enabled yet.

name: Preview sites

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Previews: the latest run wins.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # The pixi environment (pixi.toml, pinned by pixi.lock) carries
      # the tool, ffmpeg, gifsicle, Pillow, Hugo extended, Pelican,
      # MyST and Pagefind, at the versions the archive was last
      # validated against (see todo.md). Every step runs in it through
      # `pixi run`, and the sites are built by the same pixi tasks a
      # local build uses.
      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          cache: true

      - name: Tool versions
        run: |
          pixi run hugo version
          pixi run myst --version
          pixi run pagefind --version
          pixi run ffmpeg -version | head -1

      # The exporters place display copies of the archive's images,
      # built once into .image-cache/ (content-addressed, so a restored
      # cache stays valid across checkouts): the clips ffmpeg makes of
      # the animated gifs, and the webp and jpeg re-encodes of the
      # stills. A cold cache costs ~20 min on a four-core runner;
      # restored, it costs nothing.
      #
      # The key names both halves of what fills the cache -- how the
      # copies are made, and what they are made from -- because a cache
      # action saves nothing on an exact hit. A key that stays put while
      # the copies change therefore reads as a hit over copies that are
      # no longer there: every one is rebuilt, and the run, having
      # "hit", stores none of them -- on that run or on any run after
      # it. Keying on archive/posts.json alone missed both halves. The
      # move to video (#89) changed what every clip comes out as while
      # the manifest sat still, and each of the four runs after it spent
      # ~20 min rebuilding 228 clips and threw them away; a post fetched
      # without regenerating the manifest did the same for one post's
      # images.
      - name: Name the image cache for what fills it
        id: imgcache
        run: |
          # The directory the placer reads carries the cache scheme,
          # the size caps and the encode settings -- everything that
          # decides what a copy comes out as. It is asked of a real
          # placer rather than spelled out here, which would be the
          # same drift one file further away.
          id=$(pixi run python - <<'EOF'
          from pathlib import Path
          from medium_archive.paths import site_config
          from medium_archive.siteconf import load_toml
          from medium_archive.sites import ImagePlacer
          cfg = site_config(Path("site"))
          print(ImagePlacer(Path(".image-cache"),
                            load_toml(cfg) if cfg.exists() else {}).cache.name)
          EOF
          )
          # the builds of the programs that encode the copies, as
          # pixi.lock pins them: a new ffmpeg, x264, libaom (the pelican
          # site's AV1 masters), libwebp, Pillow or gifsicle can change
          # every copy, where a lock change elsewhere (a test
          # dependency) changes none
          tools=$(pixi list --json | pixi run python -c '
          import hashlib, json, sys
          pins = sorted("=".join((p["name"], p["version"], p.get("build", "")))
                        for p in json.load(sys.stdin)
                        if p["name"] in ("ffmpeg", "x264", "aom",
                                         "libwebp-base", "pillow",
                                         "gifsicle"))
          assert len(pins) == 6, pins
          print(hashlib.sha256(" ".join(pins).encode()).hexdigest()[:12])')
          # and the archive those copies are made from -- a tree lookup
          # rather than a hash of 2114 files, and it moves for an image
          # refetched in place as surely as for a new post
          archive=$(git rev-parse HEAD:archive)
          # all assigned before they are written, so that a command
          # which fails stops the step: `echo "id=$(...)" >> $GITHUB_OUTPUT`
          # would report echo's own success, leave the value empty, and
          # key every scheme alike under image-cache--<tree>.
          { echo "id=$id"; echo "tools=$tools"; echo "archive=$archive"; } >> "$GITHUB_OUTPUT"

      - name: Restore the display-copy image cache
        uses: actions/cache@v4
        with:
          path: .image-cache
          key: image-cache-${{ steps.imgcache.outputs.id }}-${{ steps.imgcache.outputs.tools }}-${{ steps.imgcache.outputs.archive }}
          # the fallback stops at this scheme and these tools: a cache
          # another one wrote holds nothing this run will read, so
          # restoring it spends hundreds of megabytes to look in the
          # wrong directory, and one other tools wrote holds copies this
          # run would not make.
          restore-keys: image-cache-${{ steps.imgcache.outputs.id }}-${{ steps.imgcache.outputs.tools }}-

      - name: Rebuild archive/posts/ from archive/raw/
        run: pixi run medium-archive convert

      - name: Build the Hugo site
        run: |
          pixi run python .github/scripts/set_base_url.py site/site.toml "${{ steps.pages.outputs.base_url }}/hugo"
          pixi run build-hugo

      - name: Build the Pelican site
        run: |
          pixi run python .github/scripts/set_base_url.py site/site.toml "${{ steps.pages.outputs.base_url }}/pelican"
          pixi run build-pelican

      # MyST takes its base path from the environment, which `pixi run`
      # passes through to the task.
      - name: Build the MyST site
        run: BASE_URL="${{ steps.pages.outputs.base_path }}/myst" pixi run build-myst

      - name: Assemble the deployment
        run: |
          mkdir _site
          mv site-hugo/public      _site/hugo
          mv site-pelican/output   _site/pelican
          mv site-myst/_build/html _site/myst
          cp .github/preview-index.html _site/index.html
          cp site/avatar.svg _site/
          du -sh _site/*

      # The artifact tar needs a few GB of scratch space; drop what the
      # deployment no longer references before it is created.
      - name: Free runner disk before the artifact step
        env:
          SCHEME: ${{ steps.imgcache.outputs.id }}
        run: |
          # .pixi too: setup-pixi saved its cache when it installed
          rm -rf .git .pixi archive/raw archive/posts site-myst site-hugo site-pelican
          # and, from the cache this run may be about to save, every
          # scheme directory but the one it filled and clips/, the h264
          # the pelican build made from its AV1 masters (named by its
          # settings inside): a cache restored across a scheme change
          # carries the generation before it, and a full set of display
          # copies is re-uploaded and restored on every run for as long
          # as the key keeps hitting.
          if [ -d .image-cache ]; then
            find .image-cache -mindepth 1 -maxdepth 1 -type d \
                 ! -name "$SCHEME" ! -name clips -exec rm -rf {} +
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
