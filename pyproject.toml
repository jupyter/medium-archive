[project]
name = "medium-archive"
version = "0.1.0"
description = "Archive a Medium publication as raw HTML plus a Markdown conversion"
readme = "README.md"
requires-python = ">=3.11"
# 3.11 for tomllib: site.toml, the hand-written input every exporter
# reads, is TOML so that each of its keys can carry what it is for
# beside it, and so is each site's own copy of that data -- which the
# generated pelican config reads back with tomllib too, in whatever
# environment the site is built in.
dependencies = [
    "requests",
    "beautifulsoup4",
    "markdownify",
    "lxml",
    # the hugo and pelican exporters write YAML front matter and the
    # sites' data files; the generated pelican config reads both back
    "pyyaml",
]

[project.optional-dependencies]
# card-cover thumbnails in the hugo and pelican exporters, and the
# animations: numpy writes the frame-rate-capped gifs the pelican site
# stores where an AV1 master does not pay
covers = ["pillow", "numpy"]
# fetch --solve-walls: a real browser for a human to clear a bot wall's
# interactive challenge by hand; still needs `playwright install chromium`
solve-walls = ["playwright"]

[project.scripts]
medium-archive = "medium_archive.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
